<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单元十九 热闹的夜市 - 华语跑酷学习乐园</title>
    <!-- Google Fonts & Canvas Confetti -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #FFF9F0;
            --primary: #FF8B94;
            --secondary: #FFAAA5;
            --accent: #FFD3B6;
            --mint: #A8E6CF;
            --sky: #DCEDC1;
            --purple: #D4A5A5;
            --dark-text: #5A4E4D;
            --white: #FFFFFF;
            --shadow: 0 8px 20px rgba(255, 139, 148, 0.2);
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans SC', 'Fredoka One', sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--dark-text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .screen { display: none; padding: 15px; max-width: 900px; margin: 0 auto; width: 100%; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--white); border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow); border: 4px solid #FFE3E3; margin-bottom: 20px; position: relative; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 50px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 0 #E06C75; margin: 5px; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.05); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #E06C75; }
        .btn-secondary { background: var(--mint); color: #2C6B56; box-shadow: 0 6px 0 #81C7B0; }
        .btn-purple { background: #B39DDB; color: white; box-shadow: 0 6px 0 #8E24AA; }
        .btn-warning { background: #FFB74D; color: white; box-shadow: 0 6px 0 #F57C00; }
        .btn-danger { background: #E57373; color: white; box-shadow: 0 6px 0 #D32F2F; }
        .btn-jump { background: #FF7043; color: white; box-shadow: 0 6px 0 #D84315; font-size: 1.5rem; padding: 18px 40px; border-radius: 30px; width: 100%; margin-top: 10px; }

        .badge { background: var(--accent); padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; color: #8A5A36; display: inline-block; }
        
        h1 { font-size: 2.2rem; color: #E06C75; text-align: center; margin-bottom: 10px; text-shadow: 2px 2px 0px #FFF; }
        h2 { font-size: 1.5rem; color: var(--dark-text); margin-bottom: 15px; }
        .subtitle { text-align: center; color: #887B7A; font-size: 1.1rem; margin-bottom: 20px; }

        input[type="text"], input[type="password"], select {
            width: 100%; padding: 12px 18px; border: 3px solid var(--accent); border-radius: 16px; font-size: 1rem; outline: none; transition: 0.2s; background: #FFFDF9; margin-top: 6px; margin-bottom: 12px;
        }

        /* 2D Game Canvas Area */
        #game-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: linear-gradient(to bottom, #1a1a2e, #16213e, #0f3460);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #FF8B94;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #5A4E4D;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Quiz Overlay Popup */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            padding: 15px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #quiz-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            border: 4px solid #FF8B94;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-height: 95%;
            overflow-y: auto;
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
        
        .option-btn { background: #FFF; border: 3px solid #E2D9D5; border-radius: 14px; padding: 12px; font-size: 1.1rem; font-weight: bold; text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .option-btn:hover { border-color: var(--primary); background: #FFF0F1; }
        .option-btn.correct { border-color: #4CAF50 !important; background: #E8F5E9 !important; color: #2E7D32; }
        .option-btn.wrong { border-color: #E57373 !important; background: #FFEBEE !important; color: #C62828; }

        .dash-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: #EFEBE9; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; }

        .editor-slot { background: #FFFDF9; border: 2px solid #EFE0D5; border-radius: 16px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .image-editor-box { background: #F5F0EB; padding: 12px; border-radius: 12px; border: 2px dashed #D7CCC8; margin: 10px 0; }
        .preview-thumb { max-width: 100px; max-height: 100px; border-radius: 8px; border: 2px solid #DDD; margin-top: 8px; }

        .lb-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .lb-table th, .lb-table td { padding: 10px; text-align: left; border-bottom: 1px solid #EEE; }
        .lb-table th { background: #FFF0F1; color: var(--dark-text); font-weight: bold; }

        .sound-toggle { position: fixed; top: 15px; right: 15px; z-index: 1000; background: white; border: 2px solid var(--accent); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.3rem; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <button class="sound-toggle" onclick="toggleMute()" id="muteBtn" title="切换声音">🔊</button>

    <!-- 1. HOMEPAGE -->
    <div id="screen-home" class="screen active">
        <div class="card" style="text-align: center;">
            <div style="font-size: 3.5rem; margin-bottom: 10px;">🐰🏃‍♂️🎪🍢</div>
            <span class="badge" id="disp-subject-year">华语 | 二年级</span>
            <h1 id="disp-title" style="margin-top: 10px;">单元十九 热闹的夜市</h1>
            <p class="subtitle">指导老师：<span id="disp-teacher">许老师</span></p>

            <div style="max-width: 380px; margin: 0 auto 20px auto;">
                <label style="font-weight: bold; display: block; text-align: left; margin-bottom: 5px;">请输入学生姓名：</label>
                <input type="text" id="player-name" placeholder="例如：小明 / Ali">
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; max-width: 380px; margin: 0 auto;">
                <button class="btn" onclick="startRunnerGame()">🚀 开始跑酷游戏</button>
                <button class="btn btn-secondary" onclick="showScreen('screen-leaderboard')">🏆 浏览排行榜</button>
                <button class="btn btn-purple" onclick="showInstructions()">📖 游戏规则说明</button>
                <button class="btn btn-warning" onclick="promptTeacherPin()">🔒 教师管理后台</button>
            </div>
        </div>
    </div>

    <!-- 2. GAME RUNNER SCREEN -->
    <div id="screen-game" class="screen">
        <div class="card" style="padding: 15px;">
            <div id="game-container">
                <div class="hud-overlay">
                    <div class="hud-box">生命: <span id="hud-lives">❤️❤️❤️</span></div>
                    <div class="hud-box">倒计时: <span id="hud-timer" style="color: #FF7043;">3s</span></div>
                    <div class="hud-box">得分: <span id="hud-score" style="color:#2E7D32;">0</span></div>
                </div>

                <canvas id="runnerCanvas" width="800" height="320"></canvas>

                <!-- Quiz Popup Overlay -->
                <div id="quiz-modal">
                    <div id="quiz-card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span class="badge">答题赚分 (+10分)</span>
                            <span style="font-weight: bold; color: #E06C75;" id="quiz-progress">问题 1 / 10</span>
                        </div>
                        <h2 id="q-text" style="font-size: 1.3rem; margin-bottom: 10px;">题目加载中...</h2>
                        <div id="q-img-box" style="display: none; margin: 10px 0;"><img id="q-img" style="max-height: 120px; border-radius: 10px;" src=""></div>
                        <div class="options-grid" id="options-container"></div>
                        <div id="explanation-box" style="display: none; margin-top: 12px; padding: 10px; background: #FFF9C4; border-radius: 10px; border: 2px solid #FBC02D; text-align: left; font-size: 0.95rem;">
                            <strong>💡 解析：</strong> <span id="exp-text"></span>
                        </div>
                        <div style="text-align: right; margin-top: 12px;">
                            <button class="btn btn-secondary" id="next-btn" style="display: none;" onclick="continueRunner()">继续跑酷 ➔</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Big Jump Button -->
            <button class="btn btn-jump" id="jumpBtn" onclick="triggerJump()">🦘 点击跳跃 (JUMP) / 按空格键</button>
        </div>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="card" style="text-align: center;">
            <div style="font-size: 4rem;" id="res-emoji">🎉</div>
            <h1 id="res-title">游戏结束！</h1>
            <p class="subtitle" id="res-subtitle">跑酷挑战顺利完成！</p>

            <div style="background: #FFF5F5; padding: 20px; border-radius: 16px; margin: 20px 0; display: inline-block; width: 100%; max-width: 400px;">
                <p style="font-size: 1.2rem; margin-bottom: 8px;">总得分: <strong style="color: #E06C75; font-size: 1.8rem;" id="res-score">0</strong></p>
                <p style="font-size: 1rem; color: #666;">答对题数: <span id="res-correct">0</span> / 10 | 用时: <span id="res-time">0秒</span></p>
            </div>

            <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button class="btn" onclick="showScreen('screen-home')">🏠 返回主页</button>
                <button class="btn btn-secondary" onclick="showScreen('screen-leaderboard')">🏆 查看排行榜</button>
            </div>
        </div>
    </div>

    <!-- 4. LEADERBOARD SCREEN -->
    <div id="screen-leaderboard" class="screen">
        <div class="card">
            <button class="btn btn-secondary" style="padding: 6px 15px; font-size: 0.9rem;" onclick="showScreen('screen-home')">⬅ 返回主页</button>
            <h1 style="margin-top: 10px;">🏆 学习英雄榜</h1>
            <div style="overflow-x: auto;">
                <table class="lb-table">
                    <thead>
                        <tr>
                            <th>名次</th>
                            <th>学生姓名</th>
                            <th>总得分</th>
                            <th>答对题数</th>
                            <th>总用时</th>
                        </tr>
                    </thead>
                    <tbody id="lb-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 5. TEACHER DASHBOARD -->
    <div id="screen-dashboard" class="screen">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h1>🔒 教师控制台 (Teacher Dashboard)</h1>
                <button class="btn btn-danger" style="padding: 6px 15px; font-size: 0.9rem;" onclick="showScreen('screen-home')">退出后台</button>
            </div>

            <div class="dash-tabs">
                <button class="tab-btn active" onclick="switchDashTab('tab-general')">⚙ 基础设置</button>
                <button class="tab-btn" onclick="switchDashTab('tab-q1')">📝 修改题目 (10题)</button>
                <button class="tab-btn" onclick="switchDashTab('tab-analytics')">📊 班级错题分析</button>
                <button class="tab-btn" onclick="switchDashTab('tab-data')">💾 JSON备份/Firebase</button>
            </div>

            <div id="tab-general" class="dash-content">
                <h2>游戏基本信息设置</h2>
                <label>游戏标题：</label><input type="text" id="cfg-title">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div><label>科目：</label><input type="text" id="cfg-subject"></div>
                    <div><label>年级：</label><input type="text" id="cfg-year"></div>
                </div>
                <label>教师姓名：</label><input type="text" id="cfg-teacher">
                <button class="btn btn-secondary" onclick="saveGeneralConfig()">💾 保存基本配置</button>
            </div>

            <div id="tab-q1" class="dash-content" style="display: none;"></div>

            <div id="tab-analytics" class="dash-content" style="display: none;">
                <h2>班级高频错题记录</h2>
                <div id="analytics-list"></div>
            </div>

            <div id="tab-data" class="dash-content" style="display: none;">
                <h2>数据备份与导入导出 (JSON)</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap;">
                    <button class="btn" onclick="exportDataJSON()">📥 导出游戏文件 (JSON)</button>
                    <button class="btn btn-purple" onclick="document.getElementById('file-import-json').click()">📤 导入游戏文件 (JSON)</button>
                    <input type="file" id="file-import-json" accept=".json" style="display:none" onchange="importDataJSON(event)">
                    <button class="btn btn-danger" onclick="resetLeaderboard()">🗑 清空排行榜数据</button>
                    <button class="btn btn-warning" onclick="restoreDefaults()">🔄 恢复系统初始模版</button>
                </div>
                <hr style="margin: 20px 0; border: 1px solid #EEE;">
                <h2>Firebase 实时云端数据库设置 (选填)</h2>
                <label>Firebase Realtime Database URL:</label>
                <input type="text" id="cfg-fb-url" placeholder="https://your-db-name.firebaseio.com">
                <button class="btn btn-secondary" onclick="saveFirebaseConfig()">💾 保存云端连接配置</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DEFAULT DATA STRUCTURE (EXACT QUESTIONS RESTORED) ---
        const DEFAULT_APP_DATA = {
            config: {
                title: "单元十九 热闹的夜市",
                subject: "华语",
                year: "二年级",
                teacher: "许老师",
                firebaseUrl: ""
            },
            questions: {
                level1: [
                    { q: "夜市里人山人海，出售的美食______，让人流口水。", img: "", options: ["多不胜数", "古色古香", "五颜六色", "一般般"], ans: 0, exp: "“多不胜数”形容数量极其繁多。", score: 10 },
                    { q: "妈妈在夜市买了一把新______子给我吃饭用。", img: "", options: ["筷", "快", "卖", "买"], ans: 0, exp: "用餐工具为“筷子”。", score: 10 },
                    { q: "夜市入口处挂满了______的灯笼，非常好看。", img: "", options: ["五颜六色", "多不胜数", "古色古香", "一般般"], ans: 0, exp: "“五颜六色”形容色彩多样鲜艳。", score: 10 },
                    { q: "这家小吃店的装修风格显得______，富有传统特色。", img: "", options: ["古色古香", "五颜六色", "多不胜数", "一般般"], ans: 0, exp: "“古色古香”形容富有古雅色彩或情调。", score: 10 },
                    { q: "小明走路的速度非常______，一会儿就跑远了。", img: "", options: ["快", "筷", "般", "古"], ans: 0, exp: "速度高为“快”。", score: 10 },
                    { q: "摊主在夜市里大声喊着，准备______完所有的水果。", img: "", options: ["卖", "买", "般", "舌"], ans: 0, exp: "出售货物为“卖”。", score: 10 },
                    { q: "我们用嘴巴和______来品尝夜市里的美味食物。", img: "", options: ["舌头", "古", "船", "筷"], ans: 0, exp: "品尝食物的味觉器官为“舌头”。", score: 10 },
                    { q: "我们搭乘小______穿过河流，前往河畔夜市。", img: "", options: ["船", "般", "快", "买"], ans: 0, exp: "水上交通工具为“船”。", score: 10 },
                    { q: "这里的夜市和普通的夜市不太一______，特别热闹。", img: "", options: ["般", "船", "筷", "卖"], ans: 0, exp: "“一般”表示普通、同样。", score: 10 },
                    { q: "弟弟拿了零用钱，向摊贩______了一份美味的章鱼烧。", img: "", options: ["买", "卖", "古", "舌"], ans: 0, exp: "购买货物为“买”。", score: 10 }
                ]
            },
            leaderboard: [],
            mistakes: {}
        };

        let appData = {};
        let currentUser = { name: "", score: 0 };
        let isMuted = false;

        // Sound Effects (Web Audio API Synthesizer)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (isMuted) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'jump') {
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(174.61, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'lifeup') { // Extra Life Sound Effect
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch (e) {}
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('muteBtn').innerText = isMuted ? "🔇" : "🔊";
        }

        // Local Storage Handling
        function initStorage() {
            const local = localStorage.getItem('CHINESE_NIGHTMARKET_RUNNER');
            if (local) {
                try { appData = JSON.parse(local); } catch(e) { appData = JSON.parse(JSON.stringify(DEFAULT_APP_DATA)); }
            } else {
                appData = JSON.parse(JSON.stringify(DEFAULT_APP_DATA));
                saveDataLocally();
            }
            renderHomepageInfo();
        }

        function saveDataLocally() {
            localStorage.setItem('CHINESE_NIGHTMARKET_RUNNER', JSON.stringify(appData));
        }

        function showScreen(screenId) {
            playSound('click');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'screen-leaderboard') renderLeaderboard();
        }

        function renderHomepageInfo() {
            document.getElementById('disp-title').innerText = appData.config.title;
            document.getElementById('disp-subject-year').innerText = `${appData.config.subject} | ${appData.config.year}`;
            document.getElementById('disp-teacher').innerText = appData.config.teacher;
        }

        function showInstructions() {
            alert("📖 游戏规则说明：\n\n1. 控制小兔子在夜市跑酷，躲避怪物障碍物。\n2. 每隔 3 秒会弹出一道华语问题，答对加 10 分！\n3. 初始包含 3 条生命（❤️❤️❤️）。每答对 3 道题会自动奖励 1 条生命！\n4. 触碰到怪物会扣除 1 条生命！\n5. 可以点击【点击跳跃】按钮、按空格键或向上方向键跳跃！");
        }

        // --- 2D RUNNER ENGINE & CANVAS GAME LOOP ---
        let canvas, ctx;
        let gameRunning = false;
        let quizPaused = false;
        let lives = 3;
        let score = 0;
        let currentQIndex = 0;
        let correctCount = 0;
        let gameStartTime = 0;
        let timerCountdown = 3;
        let timerInterval = null;

        // Player Character Object
        const player = {
            x: 80,
            y: 200,
            width: 44,
            height: 48,
            velocityY: 0,
            gravity: 0.7,
            jumpPower: -13,
            isGrounded: true,
            invulnerableTimer: 0
        };

        let monsters = [];
        let backgroundOffset = 0;
        let monsterSpawnTimer = 0;

        function startRunnerGame() {
            const name = document.getElementById('player-name').value.trim();
            if (!name) { alert("请输入学生姓名！"); return; }
            currentUser.name = name;

            showScreen('screen-game');
            
            canvas = document.getElementById('runnerCanvas');
            ctx = canvas.getContext('2d');

            // Reset Game Variables
            lives = 3;
            score = 0;
            currentQIndex = 0;
            correctCount = 0;
            gameStartTime = Date.now();
            timerCountdown = 3;
            monsters = [];
            player.y = 200;
            player.velocityY = 0;
            player.isGrounded = true;

            updateHUD();
            gameRunning = true;
            quizPaused = false;

            startQuestionTimer();
            requestAnimationFrame(gameLoop);
        }

        function triggerJump() {
            if (player.isGrounded && !quizPaused && gameRunning) {
                player.velocityY = player.jumpPower;
                player.isGrounded = false;
                playSound('jump');
            }
        }

        // Global Key Controls
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                triggerJump();
            }
        });

        // Touch Jump for Canvas
        document.getElementById('runnerCanvas').addEventListener('touchstart', function(e) {
            e.preventDefault();
            triggerJump();
        });

        function startQuestionTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerCountdown = 3;
            document.getElementById('hud-timer').innerText = `${timerCountdown}s`;

            timerInterval = setInterval(() => {
                if (!quizPaused && gameRunning) {
                    timerCountdown--;
                    document.getElementById('hud-timer').innerText = `${timerCountdown}s`;
                    if (timerCountdown <= 0) {
                        triggerQuizPopup();
                    }
                }
            }, 1000);
        }

        function gameLoop() {
            if (!gameRunning) return;

            if (!quizPaused) {
                updatePhysics();
            }
            renderCanvas();

            requestAnimationFrame(gameLoop);
        }

        function updatePhysics() {
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            const groundY = 200;
            if (player.y >= groundY) {
                player.y = groundY;
                player.velocityY = 0;
                player.isGrounded = true;
            }

            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            backgroundOffset = (backgroundOffset + 3) % canvas.width;

            monsterSpawnTimer++;
            if (monsterSpawnTimer > 120) {
                monsters.push({
                    x: canvas.width + 20,
                    y: 215,
                    width: 32,
                    height: 32,
                    speed: 4
                });
                monsterSpawnTimer = 0;
            }

            for (let i = monsters.length - 1; i >= 0; i--) {
                monsters[i].x -= monsters[i].speed;

                if (player.invulnerableTimer <= 0 &&
                    player.x < monsters[i].x + monsters[i].width &&
                    player.x + player.width > monsters[i].x &&
                    player.y < monsters[i].y + monsters[i].height &&
                    player.y + player.height > monsters[i].y) {
                    
                    lives--;
                    playSound('hit');
                    player.invulnerableTimer = 40;
                    updateHUD();

                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                }

                if (monsters[i].x < -50) {
                    monsters.splice(i, 1);
                }
            }
        }

        function renderCanvas() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#FF5252";
            for (let i = -backgroundOffset; i < canvas.width; i += 120) {
                ctx.beginPath();
                ctx.arc(i + 40, 45, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = "#FF8B94";
                ctx.fillRect(i, 80, 100, 30);
                ctx.fillStyle = "#FFF";
                ctx.fillRect(i, 110, 100, 40);
                ctx.fillStyle = "#FF5252";
            }

            ctx.fillStyle = "#5D4037";
            ctx.fillRect(0, 248, canvas.width, 72);
            ctx.fillStyle = "#8D6E63";
            ctx.fillRect(0, 248, canvas.width, 8);

            if (player.invulnerableTimer % 6 < 3) {
                ctx.fillStyle = "#FF8B94";
                ctx.beginPath();
                ctx.roundRect(player.x, player.y, player.width, player.height, 12);
                ctx.fill();

                ctx.fillStyle = "#5A4E4D";
                ctx.beginPath();
                ctx.arc(player.x + 30, player.y + 16, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#FFB7B2";
                ctx.fillRect(player.x + 8, player.y - 14, 8, 16);
                ctx.fillRect(player.x + 22, player.y - 14, 8, 16);
            }

            monsters.forEach(m => {
                ctx.fillStyle = "#D32F2F";
                ctx.beginPath();
                ctx.arc(m.x + 16, m.y + 16, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#FFF";
                ctx.beginPath();
                ctx.arc(m.x + 10, m.y + 12, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(m.x + 10, m.y + 12, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function updateHUD() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById('hud-lives').innerText = hearts || "💀";
            document.getElementById('hud-score').innerText = score;
        }

        // --- QUIZ POPUP OVERLAY ENGINE ---
        function triggerQuizPopup() {
            quizPaused = true;
            document.getElementById('quiz-modal').style.display = 'flex';

            const questions = appData.questions.level1;
            if (currentQIndex >= questions.length) {
                endGame();
                return;
            }

            const qData = questions[currentQIndex];
            document.getElementById('quiz-progress').innerText = `问题 ${currentQIndex + 1} / ${questions.length}`;
            document.getElementById('q-text').innerText = `${currentQIndex + 1}. ${qData.q}`;
            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const imgBox = document.getElementById('q-img-box');
            if (qData.img) {
                document.getElementById('q-img').src = qData.img;
                imgBox.style.display = 'block';
            } else {
                imgBox.style.display = 'none';
            }

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            const prefixes = ['A', 'B', 'C', 'D'];

            qData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span style="background: var(--accent); padding: 4px 8px; border-radius: 6px;">${prefixes[idx]}</span> ${optText}`;
                btn.onclick = () => checkQuizAnswer(idx, btn);
                optsContainer.appendChild(btn);
            });
        }

        function checkQuizAnswer(selectedIdx, btnEl) {
            const qData = appData.questions.level1[currentQIndex];
            const allBtns = document.querySelectorAll('#options-container .option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selectedIdx === qData.ans) {
                btnEl.classList.add('correct');
                score += (qData.score || 10);
                correctCount++;

                // NEW MECHANIC: ADD 1 LIFE EVERY 3 CORRECT ANSWERS
                if (correctCount % 3 === 0) {
                    lives++;
                    playSound('lifeup');
                    confetti({ particleCount: 50, spread: 50, origin: { y: 0.5 } });
                } else {
                    playSound('correct');
                }
            } else {
                playSound('wrong');
                btnEl.classList.add('wrong');
                allBtns[qData.ans].classList.add('correct');

                const qKey = `Q${currentQIndex + 1}: ${qData.q}`;
                appData.mistakes[qKey] = (appData.mistakes[qKey] || 0) + 1;
                saveDataLocally();
            }

            if (qData.exp) {
                document.getElementById('exp-text').innerText = qData.exp;
                document.getElementById('explanation-box').style.display = 'block';
            }

            document.getElementById('next-btn').style.display = 'inline-block';
            updateHUD();
        }

        function continueRunner() {
            currentQIndex++;
            document.getElementById('quiz-modal').style.display = 'none';

            if (currentQIndex >= appData.questions.level1.length) {
                endGame();
            } else {
                quizPaused = false;
                startQuestionTimer();
            }
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            document.getElementById('quiz-modal').style.display = 'none';

            const timeTaken = Math.round((Date.now() - gameStartTime) / 1000);
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-correct').innerText = correctCount;
            document.getElementById('res-time').innerText = `${timeTaken}秒`;

            if (correctCount >= 6) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                playSound('correct');
            }

            appData.leaderboard.push({
                name: currentUser.name,
                score: score,
                correct: correctCount,
                time: timeTaken
            });
            appData.leaderboard.sort((a, b) => b.score - a.score || a.time - b.time);

            saveDataLocally();
            showScreen('screen-result');
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('lb-body');
            tbody.innerHTML = '';
            if (appData.leaderboard.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">暂无排行榜数据</td></tr>';
                return;
            }
            appData.leaderboard.slice(0, 20).forEach((entry, idx) => {
                let badge = `${idx + 1}`;
                if (idx === 0) badge = '🏆 金奖';
                else if (idx === 1) badge = '🥈 银奖';
                else if (idx === 2) badge = '🥉 铜奖';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${badge}</strong></td>
                    <td>${entry.name}</td>
                    <td><strong style="color:#E06C75;">${entry.score}</strong></td>
                    <td>${entry.correct} / 10</td>
                    <td>${entry.time} 秒</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- 5. TEACHER DASHBOARD & DUAL-METHOD EDITOR ---
        function promptTeacherPin() {
            const pin = prompt("请输入教师后台密码：", "");
            if (pin === "1234") {
                renderDashboard();
                showScreen('screen-dashboard');
            } else if (pin !== null) {
                alert("密码错误！默认密码为 1234");
            }
        }

        function switchDashTab(tabId) {
            document.querySelectorAll('.dash-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.dash-content').forEach(c => c.style.display = 'none');
            event.target.classList.add('active');
            document.getElementById(tabId).style.display = 'block';
            if (tabId === 'tab-analytics') renderAnalytics();
        }

        function renderDashboard() {
            document.getElementById('cfg-title').value = appData.config.title;
            document.getElementById('cfg-subject').value = appData.config.subject;
            document.getElementById('cfg-year').value = appData.config.year;
            document.getElementById('cfg-teacher').value = appData.config.teacher;
            document.getElementById('cfg-fb-url').value = appData.config.firebaseUrl || '';

            const container = document.getElementById('tab-q1');
            container.innerHTML = `<h2>修改题目列表 (10题)</h2>`;

            appData.questions.level1.forEach((q, idx) => {
                const slot = document.createElement('div');
                slot.className = 'editor-slot';
                slot.innerHTML = `
                    <h3 style="color: var(--primary); margin-bottom: 8px;">题目 ${idx + 1}</h3>
                    <label>题目文本：</label>
                    <input type="text" value="${q.q}" onchange="updateQData(${idx}, 'q', this.value)">

                    <div class="image-editor-box">
                        <strong>🖼 题目图片设置（双重模式自动保存）：</strong>
                        <div style="margin: 6px 0;">
                            <label style="font-size:0.85rem;">方式 A: 图片网络链接 (URL / Google Drive 直链)</label>
                            <input type="text" placeholder="https://..." value="${q.img.startsWith('data:') ? '' : q.img}" onchange="updateQData(${idx}, 'img', this.value)">
                        </div>
                        <div style="margin: 6px 0;">
                            <label style="font-size:0.85rem;">方式 B: 本地图片文件上传 (Base64 Data URL 永久保存)</label><br>
                            <input type="file" accept="image/*" onchange="handleFileUpload(event, ${idx})">
                        </div>
                        ${q.img ? `
                            <div>
                                <img src="${q.img}" class="preview-thumb"><br>
                                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="clearPhoto(${idx})">❌ 清除图片</button>
                            </div>
                        ` : ''}
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div><label>选项 A:</label><input type="text" value="${q.options[0]}" onchange="updateOptionData(${idx}, 0, this.value)"></div>
                        <div><label>选项 B:</label><input type="text" value="${q.options[1]}" onchange="updateOptionData(${idx}, 1, this.value)"></div>
                        <div><label>选项 C:</label><input type="text" value="${q.options[2]}" onchange="updateOptionData(${idx}, 2, this.value)"></div>
                        <div><label>选项 D:</label><input type="text" value="${q.options[3]}" onchange="updateOptionData(${idx}, 3, this.value)"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <div>
                            <label>正确答案：</label>
                            <select onchange="updateQData(${idx}, 'ans', parseInt(this.value))">
                                <option value="0" ${q.ans === 0 ? 'selected' : ''}>选项 A</option>
                                <option value="1" ${q.ans === 1 ? 'selected' : ''}>选项 B</option>
                                <option value="2" ${q.ans === 2 ? 'selected' : ''}>选项 C</option>
                                <option value="3" ${q.ans === 3 ? 'selected' : ''}>选项 D</option>
                            </select>
                        </div>
                        <div>
                            <label>答对奖励分值：</label>
                            <input type="number" value="${q.score || 10}" onchange="updateQData(${idx}, 'score', parseInt(this.value))">
                        </div>
                    </div>

                    <label>答案解析：</label>
                    <input type="text" value="${q.exp || ''}" onchange="updateQData(${idx}, 'exp', this.value)">
                `;
                container.appendChild(slot);
            });
        }

        function handleFileUpload(event, qIndex) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                appData.questions.level1[qIndex].img = e.target.result;
                saveDataLocally();
                renderDashboard();
            };
            reader.readAsDataURL(file);
        }

        function clearPhoto(qIndex) {
            appData.questions.level1[qIndex].img = "";
            saveDataLocally();
            renderDashboard();
        }

        function updateQData(qIndex, field, value) {
            appData.questions.level1[qIndex][field] = value;
            saveDataLocally();
        }

        function updateOptionData(qIndex, optIndex, value) {
            appData.questions.level1[qIndex].options[optIndex] = value;
            saveDataLocally();
        }

        function saveGeneralConfig() {
            appData.config.title = document.getElementById('cfg-title').value;
            appData.config.subject = document.getElementById('cfg-subject').value;
            appData.config.year = document.getElementById('cfg-year').value;
            appData.config.teacher = document.getElementById('cfg-teacher').value;
            saveDataLocally();
            renderHomepageInfo();
            alert("配置已保存！");
        }

        function saveFirebaseConfig() {
            appData.config.firebaseUrl = document.getElementById('cfg-fb-url').value.trim();
            saveDataLocally();
            alert("Firebase 配置已保存！");
        }

        function renderAnalytics() {
            const container = document.getElementById('analytics-list');
            container.innerHTML = '';
            const keys = Object.keys(appData.mistakes);
            if (keys.length === 0) {
                container.innerHTML = '<p style="color:#888;">暂无答错记录。</p>';
                return;
            }
            keys.forEach(k => {
                const div = document.createElement('div');
                div.style.cssText = "padding: 10px; background: #FFEBEE; border-radius: 8px; margin-bottom: 8px; font-weight: bold;";
                div.innerText = `${k} ➔ 错题次数: ${appData.mistakes[k]} 次`;
                container.appendChild(div);
            });
        }

        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Chinese_Runner_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.config && importedData.questions) {
                        appData = importedData;
                        saveDataLocally();
                        renderHomepageInfo();
                        renderDashboard();
                        alert("JSON 数据成功恢复！");
                    }
                } catch(err) { alert("文件解析错误！"); }
            };
            reader.readAsText(file);
        }

        function resetLeaderboard() {
            if (confirm("确定要清空排行榜数据吗？")) {
                appData.leaderboard = [];
                saveDataLocally();
                alert("排行榜已清空。");
            }
        }

        function restoreDefaults() {
            if (confirm("确定重置回初始默认题目？")) {
                appData = JSON.parse(JSON.stringify(DEFAULT_APP_DATA));
                saveDataLocally();
                renderHomepageInfo();
                renderDashboard();
                alert("恢复成功。");
            }
        }

        window.onload = function() {
            initStorage();
        };
    </script>
</body>
</html>
